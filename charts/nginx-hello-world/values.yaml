replicaCount: 1

image:
  # Unprivileged build: runs as a non-root user and listens on 8080
  repository: nginxinc/nginx-unprivileged
  tag: ""  # defaults to "<appVersion>-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Content of the served index.html
page:
  title: Hello from codespace
  message: Served by nginx on the codespace k0s cluster.

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

# Gateway API route. Off by default, so the chart also installs without a
# Gateway (reach it with kubectl port-forward then)
httpRoute:
  enabled: false
  # Gateways (and optionally their listener, sectionName) to attach to, e.g.
  #  - name: public
  #    namespace: gateway
  #    sectionName: https-hello
  parentRefs: []
  # Empty matches the listener's hostnames
  hostnames: []
  path: /

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
