{{- $email := required "email is required" .Values.email }}
{{- range $name, $server := .Values.servers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  acme:
    email: {{ $email | quote }}
    server: {{ $server | quote }}
    privateKeySecretRef:
      name: letsencrypt-{{ $name }}-account-key
    solvers:
      - http01:
          {{- if eq $.Values.solver "gateway" }}
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: {{ $.Values.gateway.name | quote }}
                namespace: {{ $.Values.gateway.namespace | quote }}
                sectionName: {{ $.Values.gateway.sectionName | quote }}
          {{- else if eq $.Values.solver "ingress" }}
          ingress:
            ingressClassName: {{ $.Values.ingressClassName | quote }}
          {{- else }}
          {{- fail "solver must be ingress or gateway" }}
          {{- end }}
{{- end }}
