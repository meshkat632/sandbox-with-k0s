apiVersion: v1
kind: Namespace
metadata:
  name: k3k-shared
---
apiVersion: k3k.io/v1beta1
kind: Cluster
metadata:
  name: shared-1
  namespace: k3k-shared
spec:
  mode: shared                   # default mode: workloads run on the host via K3k's virtual kubelet (immutable)
  servers: 1                     # K3s control-plane pods (agents are ignored in shared mode)
  # version: v1.36.4-k3s1        # omit = same Kubernetes version as the host
  tlsSANs:
    - "63.185.150.41"            # host public IP: what you use from your laptop
  expose:
    nodePort:
      serverPort: 30444          # fixed NodePort -> https://63.185.150.41:30444 (30443 is taken by hcp-1)
  persistence:
    type: dynamic                # control-plane data on a PVC
    storageClassName: local-path # K3s default StorageClass on the host
    storageRequestSize: 2G
  sync:                          # what gets copied from the virtual cluster to the host (shared mode)
    services:
      enabled: true
    configMaps:
      enabled: true
    secrets:
      enabled: true
    persistentVolumeClaims:
      enabled: true
    ingresses:
      enabled: false             # turn on to expose virtual-cluster Ingresses via the host's Traefik