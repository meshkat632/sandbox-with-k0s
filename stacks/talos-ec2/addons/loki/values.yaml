# Loki as one pod with its data on a PersistentVolume - enough for one node.
deploymentMode: Monolithic

loki:
  # Single tenant: no X-Scope-OrgID header needed
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  # local-path does not enforce the volume size, so old logs have to be deleted
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    size: 3Gi

# The scalable targets default to 3 replicas each
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Off: the memcached caches alone request more memory than the node has, and
# the gateway, canary and test pods add nothing on a single node
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
