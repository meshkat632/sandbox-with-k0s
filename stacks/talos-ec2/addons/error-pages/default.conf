server {
  listen 8080;
  root /usr/share/nginx/html;

  # Anything that reaches the catch-all route gets the 404 page with status 404
  error_page 404 /404.html;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Fetched by the Traefik "error-pages" middleware, which keeps the backend's status
  location = /5xx.html {
  }

  location = /404.html {
    internal;
  }

  location / {
    return 404;
  }
}
