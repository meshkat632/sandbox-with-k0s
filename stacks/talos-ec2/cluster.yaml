# Single-node Talos cluster on EC2 (control plane also runs workloads).
# CAPI-style: infrastructure ~ AWSCluster, controlPlane ~ TalosControlPlane.
apiVersion: cluster.local/v1alpha1
kind: Cluster
metadata:
  name: talos-dev
spec:
  infrastructure:
    region: eu-central-1
    additionalTags:
      Project: talos-dev
      ManagedBy: terraform
    network:
      httpIngress:
        # 80/443 for the ingress controller; [] = closed. Open to everyone so
        # Let's Encrypt can reach the HTTP-01 challenge.
        allowedCIDRBlocks: ["0.0.0.0/0"]

  controlPlane:
    version: v1.34.1              # Kubernetes
    machineTemplate:
      spec:
        # Free tier + enough for Talos (min 2 vCPU / 2 GiB):
        #   c7i-flex.large  2 vCPU / 4 GiB   <- recommended
        #   m7i-flex.large  2 vCPU / 8 GiB
        #   t3.small        2 vCPU / 2 GiB   (bare minimum)
        #   t4g.small       2 vCPU / 2 GiB   (arm64, bare minimum)
        instanceType: c7i-flex.large
        rootVolume:
          size: 20                # GiB
        # Separate disk for persistent volumes (default StorageClass, see
        # addons/local-storage.sh). Its size is the fixed limit for all volumes
        # together. Root + data must be <= 30 GiB to stay in the free tier.
        dataVolume:
          size: 10                # GiB; 0 = no data disk
    controlPlaneConfig:
      talosVersion: v1.11.2

  # Cluster add-ons (addons/*.sh: ingress, certificates, storage, monitoring).
  # true = terraform apply runs `make addons` once the cluster is up, and again
  # when an add-on file or the node's public IP changes.
  addons:
    install: true
