# Talos cluster on EC2: one control plane node, or three behind a load
# balancer. Every node is tainted, so a pod only runs where it asks to: see
# "Scheduling" in the README.
# CAPI-style: infrastructure ~ AWSCluster, controlPlane ~ TalosControlPlane.
apiVersion: cluster.local/v1alpha1
kind: Cluster
metadata:
  name: talos-dev
spec:
  infrastructure:
    region: eu-central-1
    additionalTags:
      Project: talos-dev
      ManagedBy: terraform
    network:
      httpIngress:
        # 80/443 for the ingress controller; [] = closed. Open to everyone so
        # Let's Encrypt can reach the HTTP-01 challenge.
        allowedCIDRBlocks: ["0.0.0.0/0"]
    # Network Load Balancer with a fixed public IP: the Kubernetes API (6443)
    # goes to the control plane nodes, HTTP/HTTPS (80/443) to every node.
    # Required for more than one control plane node. Not free: roughly
    # $16-20 a month plus traffic.
    controlPlaneLoadBalancer:
      enabled: true

  controlPlane:
    # 1, 3 or 5 (etcd needs an odd number). With 3, one node may fail. More
    # than 1 is beyond the free tier. Do not lower it on a running cluster:
    # the removed nodes are not taken out of etcd first.
    replicas: 1
    version: v1.34.1              # Kubernetes
    machineTemplate:
      spec:
        # Free tier + enough for Talos (min 2 vCPU / 2 GiB):
        #   c7i-flex.large  2 vCPU / 4 GiB   <- recommended
        #   m7i-flex.large  2 vCPU / 8 GiB
        #   t3.small        2 vCPU / 2 GiB   (bare minimum)
        #   t4g.small       2 vCPU / 2 GiB   (arm64, bare minimum)
        instanceType: m7i-flex.large
        rootVolume:
          size: 20                # GiB
        # Separate disk per node for persistent volumes (default StorageClass,
        # see addons/local-storage.sh). Its size is the fixed limit for all
        # volumes on that node. With a single node, root + data must be
        # <= 30 GiB to stay in the free tier.
        dataVolume:
          size: 10                # GiB; 0 = no data disk
    controlPlaneConfig:
      talosVersion: v1.11.2

  # Extra worker nodes (0 = single node). They use the Talos and Kubernetes
  # versions of the control plane. Every worker is one more instance and disk,
  # beyond what the free tier covers for the control plane.
  workers:
    replicas: 3
    machineTemplate:
      spec:
        instanceType: c7i-flex.large   # same choices as the control plane
        rootVolume:
          size: 20                     # GiB

  # Cluster add-ons: one entry per script in addons/. terraform apply (and
  # `make addons`) installs the listed ones, always in dependency order, once
  # the cluster is up - and again when the list, an add-on file or the node's
  # public IP changes. Comment an entry out to skip it; [] installs nothing.
  # Removing an entry does not uninstall the add-on.
  addons:
    install:
      - metrics-server      # kubectl top, HPA
      #- node-exporter       # node metrics
      #- kube-state-metrics  # object state metrics
      - local-storage       # default StorageClass on the data disk
      #- prometheus          # needs local-storage
      #- loki                # needs local-storage; includes the Alloy log collector
      - traefik             # ingress controller on 80/443
      - cert-manager
      #- wildcard-cert       # needs traefik, cert-manager
      #- error-pages         # needs traefik
      - letsencrypt         # needs traefik, cert-manager
      #- hello-world         # needs traefik, letsencrypt
      #- grafana             # needs local-storage, traefik, letsencrypt
